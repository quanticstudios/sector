name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -tags=novulkan

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Install Gio's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles-dev libegl-dev libffi-dev libxcursor-dev libxfixes-dev
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf 'gofmt needed:\n%s\n' "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race -timeout 5m ./...
      - name: Scripts
        run: |
          # why: the runner's sh is dash, as on Ubuntu machines that run get.sh; bash is the other common sh.
          test "$(readlink -f /bin/sh)" = /usr/bin/dash
          for f in scripts/*.sh; do sh -n "$f"; bash -n "$f"; done
          for shell in sh bash; do
            "$shell" scripts/get_test.sh
            "$shell" scripts/release_test.sh
          done

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # why: HEAD is the PR merged into its base, so HEAD^1 is the base.
          fetch-depth: 2
          persist-credentials: false
      - name: Require a CHANGELOG.md entry for code changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if git diff --quiet HEAD^1 HEAD -- cmd sample procs view theme; then
            echo 'No change under cmd/, sample/, procs/, view/ or theme/.'
            exit 0
          fi
          # why: read live, so adding the label and re-running the job skips it.
          label=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq 'any(.labels[]; .name == "no-changelog")') || label=false
          if [ "$label" = true ]; then
            echo 'Skipped: the PR has the no-changelog label.'
            exit 0
          fi
          git show HEAD^1:CHANGELOG.md | awk '/^## /{n++} n==1' > base.md
          awk '/^## /{n++} n==1' CHANGELOG.md > head.md
          added=$(grep -vxFf base.md head.md | grep -v '^## ' | grep '[^[:space:]]' || true)
          if [ -n "$added" ]; then
            printf 'New in the top CHANGELOG.md section:\n%s\n' "$added"
            exit 0
          fi
          echo "::error file=CHANGELOG.md::This PR changes cmd/, sample/, procs/, view/ or theme/ but adds no line under the top '## Unreleased' section of CHANGELOG.md. Add one, or ask a maintainer for the no-changelog label and re-run this job."
          exit 1
